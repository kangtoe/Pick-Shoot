<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pick &amp; Shoot</title>
    <!--
      Pick&Shoot 웹 빌드 템플릿 (2026-10-15). Unity Base/Default 템플릿에서 줄였다.
      캔버스가 브라우저 창을 꽉 채운다 — 게임이 16:9 띠(ScreenLetterbox)와 1920×1080 기준 UI 배율(PixelGui)을 스스로 맞추므로
      고정 크기 캔버스(창보다 크면 잘림)나 크게 그려 CSS로 줄이기(픽셀 아트가 뭉개짐)보다 창 크기 그대로 그리는 쪽이 가장 크고 선명하다.
    -->
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #000; outline: none; }
      #loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 320px; text-align: center;
                 font: 14px/1.4 system-ui, sans-serif; color: #bebad6; }
      #loading .title { font-size: 20px; letter-spacing: 0.15em; color: #fff; margin-bottom: 14px; }
      #bar { height: 10px; border: 2px solid #47324b; background: #130d16; }
      #bar-full { height: 100%; width: 0; background: #f5a13c; }
      #notice { margin-top: 14px; }
      #warning { position: fixed; left: 0; right: 0; top: 0; text-align: center; font: 14px system-ui, sans-serif; display: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div class="title">PICK &amp; SHOOT</div>
      <div id="bar"><div id="bar-full"></div></div>
      <div id="notice">Keyboard and mouse required</div>
    </div>
    <div id="warning"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var banner = document.querySelector("#warning");
        var div = document.createElement("div");
        div.innerHTML = msg;
        div.style = "padding: 10px; background: " + (type == "error" ? "#c0392b" : "#e0b030") + ";";
        banner.appendChild(div);
        banner.style.display = "block";
        if (type != "error") setTimeout(function () {
          banner.removeChild(div);
          if (!banner.children.length) banner.style.display = "none";
        }, 5000);
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Pick_Shoot",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // 클릭하면 캔버스가 키보드를 받는다 (Space·WASD가 페이지 스크롤로 새지 않게).
      canvas.addEventListener("pointerdown", function () { canvas.focus(); });

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#bar-full").style.width = 100 * progress + "%";
        }).then(function () {
          document.querySelector("#loading").style.display = "none";
          canvas.focus();
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
